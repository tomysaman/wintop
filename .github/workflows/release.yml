# Builds wintop.exe and publishes a GitHub Release when a version tag (v1.2.3) is pushed.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Version from tag
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "tag '$env:TAG' is not a version like v1.2.3" }
          $v = $env:TAG.TrimStart('v')
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Publish
        run: dotnet publish src/WinTop.csproj -c Release -o out -p:Version=${{ env.VERSION }}

      - name: Check version
        shell: pwsh
        run: |
          $got = (& out/wintop.exe --version).Trim()
          if ($got -ne "wintop $env:VERSION") { throw "exe reports '$got', expected 'wintop $env:VERSION'" }

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash out/wintop.exe -Algorithm SHA256).Hash.ToLower()
          # LF line ending so `sha256sum -c` works on Linux/macOS and Git Bash
          [IO.File]::WriteAllText("$PWD/out/wintop.exe.sha256", "$h  wintop.exe`n")

      - name: Release notes
        shell: pwsh
        run: ./.github/release-notes.ps1 -Version $env:VERSION -Out notes.md

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG
          $opts = @('--title', "wintop $tag", '--notes-file', 'notes.md')
          if ($tag.Contains('-')) { $opts += '--prerelease' }   # v1.2.0-beta.1
          gh release create $tag out/wintop.exe out/wintop.exe.sha256 @opts
